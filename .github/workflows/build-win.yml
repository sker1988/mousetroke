name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run overlay tests
        run: cargo test -p mousetroke-win

      - name: Run official build script
        shell: cmd
        run: scripts\build.cmd

      - name: Upload built executable
        uses: actions/upload-artifact@v4
        with:
          name: mousetroke-win-patched
          path: |
            target/release/mousetroke.exe
            target/release/mousetroke-settings.exe
            dist/**
            release/**
          if-no-files-found: warn
